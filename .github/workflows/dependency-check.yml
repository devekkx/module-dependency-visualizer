name: Dependency Check

on:
  pull_request:
    branches: [develop]

concurrency:
  group: dep-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build mdv from source
        run: make build

      - name: Analyze & audit
        run: ./dist/mdv analyze . --audit --format markdown

      - name: Diff dependencies
        run: ./dist/mdv diff . --from ${{ github.event.pull_request.base.sha }} || true

      - name: Generate DEPENDENCIES.md
        run: ./dist/mdv docs . --output DEPENDENCIES.md --audit

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./... 2>&1 | tee govulncheck.txt || true

      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sections = [];

            sections.push('## Dependency Audit\n');

            if (fs.existsSync('DEPENDENCIES.md')) {
              sections.push(fs.readFileSync('DEPENDENCIES.md', 'utf8'));
            } else {
              sections.push('_No DEPENDENCIES.md generated._\n');
            }

            if (fs.existsSync('govulncheck.txt')) {
              const vuln = fs.readFileSync('govulncheck.txt', 'utf8').trim();
              sections.push('\n### govulncheck\n\n```\n' + vuln + '\n```\n');
            }

            let body = sections.join('\n');
            if (body.length > 65000) body = body.slice(0, 65000) + '\n\n...(truncated)';

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' && c.body.startsWith('## Dependency Audit')
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Upload DEPENDENCIES.md
        uses: actions/upload-artifact@v4
        with:
          name: dependencies-doc
          path: DEPENDENCIES.md
          if-no-files-found: ignore
          retention-days: 30

  security-scan:
    name: Security Scan (gosec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gosec
        uses: securego/gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif
