name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -race ./...

      - name: Build cross-platform binaries
        run: |
          VERSION="${{ github.ref_name }}"
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          PKG="github.com/devekkx/module-dependency-visualizer"
          LDFLAGS="-s -w \
            -X '${PKG}/internal/config.version=${VERSION}' \
            -X '${PKG}/internal/config.commit=${COMMIT}' \
            -X '${PKG}/internal/config.buildDate=${BUILD_DATE}'"

          mkdir -p dist

          platforms=(
            "linux/amd64"
            "linux/arm64"
            "darwin/amd64"
            "darwin/arm64"
            "windows/amd64"
          )

          for platform in "${platforms[@]}"; do
            OS="${platform%/*}"
            ARCH="${platform#*/}"
            EXT=""
            [ "$OS" = "windows" ] && EXT=".exe"

            GOOS="$OS" GOARCH="$ARCH" CGO_ENABLED=0 \
              go build -ldflags "${LDFLAGS}" \
              -o "dist/staging/mdv${EXT}" ./cmd/mdv

            ARCHIVE="dist/mdv_${VERSION}_${OS}_${ARCH}"
            if [ "$OS" = "windows" ]; then
              zip "${ARCHIVE}.zip" -j "dist/staging/mdv${EXT}" README.md LICENSE
            else
              tar -czf "${ARCHIVE}.tar.gz" \
                -C dist/staging "mdv${EXT}" \
                -C "${{ github.workspace }}" README.md LICENSE
            fi
            rm -f "dist/staging/mdv${EXT}"
          done

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.tar.gz *.zip 2>/dev/null > checksums.txt || sha256sum *.tar.gz > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
