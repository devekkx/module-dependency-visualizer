linters:
  disable-all: true
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - unconvert
    - unparam
    - whitespace
    - noctx
    - bodyclose
    - contextcheck

linters-settings:
  goimports:
    local-prefixes: github.com/devekkx/module-dependency-visualizer

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  exclude-rules:
    - path: "_test\\.go"
      linters:
        - unparam
